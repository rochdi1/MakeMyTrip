version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: mmt-postgres
    environment:
      POSTGRES_USER: mmt_user
      POSTGRES_PASSWORD: mmt_password
      POSTGRES_DB: mmt_flight_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - mmt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmt_user -d mmt_flight_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  eureka-server:
    build: ./eureka-server
    container_name: mmt-eureka-server
    ports:
      - "8761:8761"
    networks:
      - mmt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-service:
    build: ./gateway-service
    container_name: mmt-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - mmt-network

  flight-service:
    build: ./flight-service
    container_name: mmt-flight-service
    ports:
      - "8081:8081"
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mmt-network

  train-service:
    build: ./train-service
    container_name: mmt-train-service
    ports:
      - "8082:8082"
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mmt-network

  hotel-service:
    build: ./hotel-service
    container_name: mmt-hotel-service
    ports:
      - "8083:8083"
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - mmt-network

volumes:
  pgdata:

networks:
  mmt-network:
    driver: bridge
